<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding-left: 190px;
          font-family: sans-serif;
          color: #f8fafc;
        }
        .row { margin-bottom: 46px; }
        .row b {
          display: block;
          font-size: 84px;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .row i {
          display: block;
          margin-top: 8px;
          font-size: 30px;
          font-style: normal;
          font-family: monospace;
          letter-spacing: 0.12em;
          color: #94a3b8;
        }
        .row u {
          display: block;
          height: 6px;
          margin-top: 20px;
          border-radius: 6px;
          background: linear-gradient(90deg, #22d3ee, rgba(167, 139, 250, 0.15));
          transform-origin: 0% 50%;
        }
        #pill {
          display: inline-block;
          align-self: flex-start;
          margin-top: 6px;
          padding: 16px 34px;
          border: 2px solid rgba(34, 211, 238, 0.65);
          border-radius: 999px;
          font-family: monospace;
          font-size: 30px;
          letter-spacing: 0.18em;
          color: #22d3ee;
        }
      </style>

      <div id="root" data-composition-id="scene-stack" data-width="1920" data-height="1080">
        <div class="row" id="row-1">
          <b>HTML &rarr; MP4</b>
          <i>author once, render deterministic video</i>
          <u></u>
        </div>
        <div class="row" id="row-2">
          <b>Seekable GSAP</b>
          <i>paused timeline, one frame per tick</i>
          <u></u>
        </div>
        <div class="row" id="row-3">
          <b>1080p Kinetic Type</b>
          <i>motion is the message</i>
          <u></u>
        </div>
        <span id="pill">30 FPS &middot; HEADLESS CHROME</span>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".row",
          { x: -70, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.14 },
          0.2
        );
        tl.fromTo(
          ".row u",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power2.inOut", stagger: 0.12 },
          1.0
        );
        tl.fromTo(
          "#pill",
          { scale: 0.86, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)" },
          2.1
        );
        tl.to(".row, #pill", { opacity: 0, duration: 0.32 }, 3.05);
        window.__timelines["scene-stack"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
