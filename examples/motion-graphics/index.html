<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: sans-serif;
        color: #f8fafc;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1200px 700px at 18% 22%, rgba(34, 211, 238, 0.18), transparent 60%),
          radial-gradient(1000px 620px at 82% 78%, rgba(167, 139, 250, 0.20), transparent 62%),
          linear-gradient(160deg, #05070d 0%, #0a1020 55%, #060810 100%);
      }
      .grid {
        position: absolute;
        inset: -6%;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.16) 1px, transparent 1px);
        background-size: 96px 96px;
        transform-origin: 50% 50%;
      }
      .mount { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div class="bg" id="bg"></div>
      <div class="grid" id="grid"></div>

      <div
        id="mount-brand"
        class="mount"
        data-composition-id="scene-brand"
        data-composition-src="compositions/scene-brand.html"
        data-start="0"
        data-duration="2.6"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="mount-stack"
        class="mount"
        data-composition-id="scene-stack"
        data-composition-src="compositions/scene-stack.html"
        data-start="2.6"
        data-duration="3.4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="mount-outro"
        class="mount"
        data-composition-id="scene-outro"
        data-composition-src="compositions/scene-outro.html"
        data-start="6"
        data-duration="2"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      // Root timeline owns only the shared background; each scene registers its own.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.0);
      tl.fromTo(
        "#grid",
        { opacity: 0, scale: 1.14 },
        { opacity: 0.55, scale: 1, duration: 1.8, ease: "power2.out" },
        0.1
      );
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
